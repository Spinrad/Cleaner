[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cleaner"
version = "0.1.0"
description = "CLI DSP tool for restoring Post-Punk live recordings — ffmpeg-native architecture"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = [
    "scipy>=1.11.0",
    "numpy>=1.26.0",
    "click>=8.0.0",
    "soundfile>=0.12.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "coverage>=6.0",
]

[project.scripts]
cleaner = "cleaner.__main__:main"

[tool.setuptools.packages.find]
include = ["cleaner*"]
